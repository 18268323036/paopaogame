<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎈 彩色泡泡 popping 游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 游戏标题 */
        .game-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .game-title {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
        }

        .score-board {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .score-item {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        /* 游戏区域 */
        .game-container {
            position: fixed;
            top: 80px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        /* 泡泡样式 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 
                inset -10px -10px 20px rgba(0,0,0,0.1),
                inset 10px 10px 20px rgba(255,255,255,0.5),
                0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            animation: float 3s ease-in-out infinite;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 25%;
            height: 15%;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: rotate(-45deg);
        }

        .bubble:active {
            transform: scale(0.9);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        /* 泡泡破裂动画 */
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .bubble.popped {
            animation: pop 0.3s ease-out forwards;
        }

        /* 粒子效果 */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            animation: particle-fly 0.6s ease-out forwards;
        }

        @keyframes particle-fly {
            0% { 
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% { 
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* 开始/结束界面 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(5px);
        }

        .modal {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modal-appear 0.5s ease-out;
        }

        @keyframes modal-appear {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal h1 {
            font-size: 36px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .final-score {
            font-size: 48px;
            color: #f5576c;
            font-weight: bold;
            margin: 20px 0;
        }

        /* 连击显示 */
        .combo {
            position: fixed;
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            pointer-events: none;
            animation: combo-float 1s ease-out forwards;
            z-index: 50;
        }

        @keyframes combo-float {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-60px) scale(1); opacity: 0; }
        }

        /* 难度选择 */
        .difficulty-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 12px 24px;
            border: 3px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-btn:hover, .difficulty-btn.active {
            background: #667eea;
            color: white;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .game-title {
                font-size: 18px;
            }
            .score-item {
                font-size: 14px;
                padding: 6px 12px;
            }
            .modal h1 {
                font-size: 28px;
            }
            .btn {
                font-size: 20px;
                padding: 15px 40px;
            }
        }
    </style>
</head>
<body>
    <!-- 游戏头部 -->
    <div class="game-header">
        <div class="game-title">🎈 泡泡 popping</div>
        <div class="score-board">
            <div class="score-item">⭐ 得分: <span id="score">0</span></div>
            <div class="score-item">⏱️ 时间: <span id="time">60</span>秒</div>
        </div>
    </div>

    <!-- 游戏区域 -->
    <div class="game-container" id="gameContainer"></div>

    <!-- 开始界面 -->
    <div class="overlay" id="startScreen">
        <div class="modal">
            <h1>🎈 泡泡 popping</h1>
            <p>点击彩色泡泡来得分！<br>不同颜色分数不同哦～</p>
            <div class="difficulty-buttons">
                <button class="difficulty-btn active" data-difficulty="easy">简单</button>
                <button class="difficulty-btn" data-difficulty="medium">中等</button>
                <button class="difficulty-btn" data-difficulty="hard">困难</button>
            </div>
            <button class="btn" onclick="startGame()" style="margin-top: 20px;">开始游戏 🎮</button>
        </div>
    </div>

    <!-- 结束界面 -->
    <div class="overlay" id="endScreen" style="display: none;">
        <div class="modal">
            <h1>🎉 游戏结束!</h1>
            <p>你真棒！</p>
            <div class="final-score"><span id="finalScore">0</span> 分</div>
            <button class="btn" onclick="restartGame()">再玩一次 🔄</button>
        </div>
    </div>

    <script>
        // 游戏配置
        const config = {
            easy: { spawnRate: 1500, bubbleSpeed: 3000, maxBubbles: 8 },
            medium: { spawnRate: 1000, bubbleSpeed: 2500, maxBubbles: 12 },
            hard: { spawnRate: 700, bubbleSpeed: 2000, maxBubbles: 15 }
        };

        // 泡泡配置（含独特音效参数）
        const bubbleTypes = [
            { color: '#FF6B6B', emoji: '❤️', score: 10, size: 80,  sound: { freq: 523, endFreq: 784, wave: 'sine',     dur: 0.15 } }, // Do→Sol 清脆叮咚
            { color: '#4ECDC4', emoji: '🐟', score: 15, size: 70,  sound: { freq: 392, endFreq: 587, wave: 'triangle', dur: 0.20 } }, // Sol→Re 柔和水滴
            { color: '#45B7D1', emoji: '⭐', score: 20, size: 75,  sound: { freq: 659, endFreq: 988, wave: 'sine',     dur: 0.12 } }, // Mi→高Mi 闪亮叮铃
            { color: '#96CEB4', emoji: '🐸', score: 15, size: 85,  sound: { freq: 330, endFreq: 440, wave: 'square',   dur: 0.18 } }, // 呱呱低音
            { color: '#FFEAA7', emoji: '🌟', score: 25, size: 65,  sound: { freq: 784, endFreq: 1047, wave: 'sine',    dur: 0.10 } }, // Sol→高Do 升调星光
            { color: '#DDA0DD', emoji: '🦋', score: 20, size: 70,  sound: { freq: 587, endFreq: 880, wave: 'triangle', dur: 0.16 } }, // Re→La 飘逸
            { color: '#98D8C8', emoji: '🐢', score: 15, size: 90,  sound: { freq: 262, endFreq: 330, wave: 'sawtooth', dur: 0.22 } }, // Do低音 慢悠悠
            { color: '#F7DC6F', emoji: '🌻', score: 20, size: 75,  sound: { freq: 698, endFreq: 880, wave: 'sine',     dur: 0.14 } }  // Fa→La 温暖阳光
        ];

        // 游戏状态
        let score = 0;
        let timeLeft = 60;
        let gameActive = false;
        let currentDifficulty = 'easy';
        let spawnInterval;
        let timerInterval;
        let bubbles = [];
        let combo = 0;
        let lastClickTime = 0;

        // 音效（使用 Web Audio API）
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // 根据泡泡类型播放独特音效
        function playBubbleSound(soundConfig) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.type = soundConfig.wave;
            osc.frequency.setValueAtTime(soundConfig.freq, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(soundConfig.endFreq, audioContext.currentTime + soundConfig.dur);

            gain.gain.setValueAtTime(0.25, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + soundConfig.dur);

            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + soundConfig.dur + 0.02);
        }

        function playComboSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1000, audioContext.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }

        // 难度选择
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentDifficulty = this.dataset.difficulty;
            });
        });

        // 创建泡泡
        function createBubble() {
            if (!gameActive || bubbles.length >= config[currentDifficulty].maxBubbles) return;

            const container = document.getElementById('gameContainer');
            const type = bubbleTypes[Math.floor(Math.random() * bubbleTypes.length)];
            const bubble = document.createElement('div');
            
            bubble.className = 'bubble';
            bubble.style.width = type.size + 'px';
            bubble.style.height = type.size + 'px';
            bubble.style.background = `radial-gradient(circle at 30% 30%, ${type.color}, ${adjustColor(type.color, -30)})`;
            bubble.style.left = Math.random() * (container.offsetWidth - type.size) + 'px';
            bubble.style.top = container.offsetHeight + 'px';
            bubble.innerHTML = type.emoji;
            bubble.dataset.score = type.score;
            
            // 点击事件
            bubble.addEventListener('click', function(e) {
                if (!gameActive || this.classList.contains('popped')) return;
                
                // 连击检测
                const now = Date.now();
                if (now - lastClickTime < 1000) {
                    combo++;
                } else {
                    combo = 1;
                }
                lastClickTime = now;
                
                // 计算得分（连击加成）
                const points = parseInt(this.dataset.score) * Math.min(combo, 5);
                score += points;
                updateScore();
                
                // 播放音效（每种泡泡独特音色）
                if (combo > 1) {
                    playComboSound();
                    showCombo(e.clientX, e.clientY, combo);
                } else {
                    playBubbleSound(type.sound);
                }
                
                // 创建粒子效果
                createParticles(e.clientX, e.clientY, type.color);
                
                // 破裂动画
                this.classList.add('popped');
                setTimeout(() => {
                    this.remove();
                    bubbles = bubbles.filter(b => b !== this);
                }, 300);
            });
            
            // 触摸事件（移动端支持）
            bubble.addEventListener('touchstart', function(e) {
                e.preventDefault();
                this.click();
            });
            
            container.appendChild(bubble);
            bubbles.push(bubble);
            
            // 泡泡上升动画
            const duration = config[currentDifficulty].bubbleSpeed + Math.random() * 1000;
            bubble.style.transition = `top ${duration}ms linear`;
            
            setTimeout(() => {
                if (bubble.parentNode) {
                    bubble.style.top = '-100px';
                }
            }, 50);
            
            // 移除到达顶部的泡泡
            setTimeout(() => {
                if (bubble.parentNode && !bubble.classList.contains('popped')) {
                    bubble.remove();
                    bubbles = bubbles.filter(b => b !== this);
                    combo = 0; // 错过泡泡重置连击
                }
            }, duration + 100);
        }

        // 创建粒子效果
        function createParticles(x, y, color) {
            const container = document.getElementById('gameContainer');
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = color;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = (Math.PI * 2 * i) / 8;
                const distance = 50 + Math.random() * 50;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                container.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }

        // 显示连击
        function showCombo(x, y, comboCount) {
            const container = document.getElementById('gameContainer');
            const comboEl = document.createElement('div');
            comboEl.className = 'combo';
            comboEl.textContent = `${comboCount} 连击! x${Math.min(comboCount, 5)}`;
            comboEl.style.left = x + 'px';
            comboEl.style.top = y + 'px';
            container.appendChild(comboEl);
            setTimeout(() => comboEl.remove(), 1000);
        }

        // 调整颜色亮度
        function adjustColor(color, amount) {
            const num = parseInt(color.replace('#', ''), 16);
            const r = Math.min(255, Math.max(0, (num >> 16) + amount));
            const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
            const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
            return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
        }

        // 更新分数
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // 更新时间
        function updateTime() {
            document.getElementById('time').textContent = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }

        // 开始游戏
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            score = 0;
            timeLeft = 60;
            combo = 0;
            gameActive = true;
            bubbles = [];
            updateScore();
            updateTime();
            
            // 开始生成泡泡
            spawnInterval = setInterval(createBubble, config[currentDifficulty].spawnRate);
            
            // 开始计时
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTime();
            }, 1000);
        }

        // 结束游戏
        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            clearInterval(timerInterval);
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('endScreen').style.display = 'flex';
        }

        // 重新开始
        function restartGame() {
            document.getElementById('endScreen').style.display = 'none';
            document.getElementById('gameContainer').innerHTML = '';
            document.getElementById('startScreen').style.display = 'flex';
        }

        // 防止页面滚动（移动端）
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
